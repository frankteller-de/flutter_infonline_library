group 'com.hankfrinkle.flutter_infonline_library'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.hankfrinkle.flutter_infonline_library'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk 21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Required by the vendor SDK when accessing preferences and the advertising ID.
    implementation 'androidx.preference:preference-ktx:1.1.1'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    // The vendor calls GoogleApiAvailability directly; retain API 21 support.
    implementation 'com.google.android.gms:play-services-base:18.5.0'
    // The consuming app supplies this licensed AAR through its repositories.
    implementation 'de.infonline.lib:infonlinelib_2.5.0@aar'
}
